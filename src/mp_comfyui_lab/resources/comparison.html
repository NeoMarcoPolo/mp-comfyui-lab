<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow experiment comparison</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #182126;
      background: #f4f6f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header {
      padding: 24px max(24px, calc((100% - 1440px) / 2));
      color: #ffffff;
      background: #263238;
      border-bottom: 4px solid #d9a441;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
    header p { margin: 0; color: #e7ecee; }
    main { max-width: 1440px; margin: 0 auto; padding: 24px; }
    .variant { padding: 24px 0 32px; border-bottom: 1px solid #c7d0d5; }
    .variant h2 { margin: 0 0 16px; font-size: 22px; letter-spacing: 0; }
    dl {
      display: grid;
      grid-template-columns: minmax(110px, 160px) minmax(0, 1fr);
      gap: 8px 16px;
      margin: 0 0 20px;
      font-size: 14px;
    }
    dt { color: #526168; font-weight: 700; }
    dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
    code { white-space: pre-wrap; overflow-wrap: anywhere; }
    .outputs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 16px;
    }
    figure {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #c7d0d5;
      border-radius: 6px;
    }
    .media {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 12px;
      background: #e8edef;
    }
    img, video { display: block; width: 100%; max-height: 420px; object-fit: contain; }
    audio { width: 100%; }
    figcaption { display: grid; gap: 6px; padding: 14px; font-size: 13px; }
    figcaption span { min-width: 0; overflow-wrap: anywhere; }
    .artifact-link { color: #075b52; font-weight: 700; }
    .missing, .empty { color: #5b4a24; }
    @media (max-width: 640px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      dl { grid-template-columns: 1fr; gap: 4px; }
      dd { margin-bottom: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Workflow experiment comparison</h1>
    <p>Experiment <code>$experiment_id</code></p>
  </header>
  <main>
    $variant_sections
  </main>
</body>
</html>

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-comfyui-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "requests>=2.31,<3",
    "Pillow>=10,<13",
    "ImageHash>=4.3,<5",
    "mp-runninghub-api @ file:///Z:/web/marcopolo/mp-runninghub-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "responses>=0.25,<1",
]

[project.scripts]
mp-comfy-lab = "mp_comfyui_lab.cli.app:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mp_comfyui_lab = ["resources/*.yaml", "resources/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
